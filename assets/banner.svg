<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');

      .bg { fill: #0D1117; }
      .scanline {
        fill: rgba(0, 255, 65, 0.03);
        animation: scanMove 8s linear infinite;
      }
      @keyframes scanMove {
        0% { transform: translateY(-320px); }
        100% { transform: translateY(320px); }
      }

      .access-text {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 14px;
        font-weight: 700;
        fill: #00FF41;
        letter-spacing: 8px;
        text-anchor: middle;
        animation: glitch 3s infinite;
      }
      @keyframes glitch {
        0%, 90%, 100% { opacity: 1; transform: translate(0,0); }
        91% { opacity: 0.8; transform: translate(-2px, 1px); fill: #00E5FF; }
        92% { opacity: 0.6; transform: translate(2px, -1px); fill: #FF0040; }
        93% { opacity: 1; transform: translate(0,0); fill: #00FF41; }
        95% { opacity: 0.9; transform: translate(1px, 0); }
      }

      .name-text {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 38px;
        font-weight: 700;
        fill: #E6EDF3;
        text-anchor: middle;
        animation: nameReveal 2s ease-out forwards;
        opacity: 0;
      }
      @keyframes nameReveal {
        0% { opacity: 0; letter-spacing: 20px; }
        50% { opacity: 0.5; }
        100% { opacity: 1; letter-spacing: 3px; }
      }

      .role-text {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 16px;
        font-weight: 400;
        fill: #00E5FF;
        text-anchor: middle;
        letter-spacing: 6px;
        animation: rolePulse 4s ease-in-out infinite;
      }
      @keyframes rolePulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; fill: #00FF41; }
      }

      .border-line {
        stroke: #00FF41;
        stroke-width: 1;
        fill: none;
        stroke-dasharray: 900;
        animation: borderDraw 3s ease-out forwards;
      }
      @keyframes borderDraw {
        0% { stroke-dashoffset: 900; }
        100% { stroke-dashoffset: 0; }
      }

      .corner {
        stroke: #00E5FF;
        stroke-width: 2;
        fill: none;
        opacity: 0;
        animation: cornerFade 0.5s ease-out forwards;
      }
      .corner-tl { animation-delay: 0.5s; }
      .corner-tr { animation-delay: 0.7s; }
      .corner-bl { animation-delay: 0.9s; }
      .corner-br { animation-delay: 1.1s; }
      @keyframes cornerFade {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }

      .matrix-drop {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        fill: #00FF41;
        opacity: 0;
      }
      .md1 { animation: matDrop 6s linear infinite; }
      .md2 { animation: matDrop 8s linear 1s infinite; }
      .md3 { animation: matDrop 7s linear 2s infinite; }
      .md4 { animation: matDrop 5s linear 0.5s infinite; }
      .md5 { animation: matDrop 9s linear 3s infinite; }
      .md6 { animation: matDrop 6.5s linear 1.5s infinite; }
      .md7 { animation: matDrop 7.5s linear 0.8s infinite; }
      .md8 { animation: matDrop 5.5s linear 2.5s infinite; }

      @keyframes matDrop {
        0% { opacity: 0; transform: translateY(-20px); }
        10% { opacity: 0.3; }
        90% { opacity: 0.1; }
        100% { opacity: 0; transform: translateY(340px); }
      }

      .cursor-blink {
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .hex-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        fill: #00FF41;
        opacity: 0.25;
      }

      .status-dot {
        fill: #00FF41;
        animation: dotPulse 2s ease-in-out infinite;
      }
      @keyframes dotPulse {
        0%, 100% { opacity: 0.4; r: 3; }
        50% { opacity: 1; r: 4; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="900" height="320" rx="6"/>

  <!-- Matrix rain characters -->
  <text class="matrix-drop md1" x="45" y="10">01101</text>
  <text class="matrix-drop md2" x="130" y="10">10011</text>
  <text class="matrix-drop md3" x="680" y="10">11010</text>
  <text class="matrix-drop md4" x="790" y="10">01110</text>
  <text class="matrix-drop md5" x="85" y="10">10101</text>
  <text class="matrix-drop md6" x="820" y="10">00110</text>
  <text class="matrix-drop md7" x="350" y="10">11001</text>
  <text class="matrix-drop md8" x="550" y="10">01011</text>

  <!-- Scanline effect -->
  <rect class="scanline" x="0" y="0" width="900" height="4"/>

  <!-- Border lines -->
  <line class="border-line" x1="20" y1="15" x2="880" y2="15"/>
  <line class="border-line" x1="20" y1="305" x2="880" y2="305"/>

  <!-- Corner brackets -->
  <polyline class="corner corner-tl" points="20,35 20,15 40,15"/>
  <polyline class="corner corner-tr" points="860,15 880,15 880,35"/>
  <polyline class="corner corner-bl" points="20,285 20,305 40,305"/>
  <polyline class="corner corner-br" points="860,305 880,305 880,285"/>

  <!-- Hex decorations -->
  <text class="hex-label" x="30" y="30">0x00FF41</text>
  <text class="hex-label" x="800" y="30">SYS:ACTIVE</text>
  <text class="hex-label" x="30" y="300">SEC:ARMED</text>
  <text class="hex-label" x="790" y="300">0x00E5FF</text>

  <!-- Status dots -->
  <circle class="status-dot" cx="775" cy="26" r="3"/>
  <circle class="status-dot" cx="785" cy="26" r="3" style="animation-delay: 0.3s;"/>

  <!-- ACCESS GRANTED -->
  <text class="access-text" x="450" y="85">
    <tspan>▸ ACCESS GRANTED ▸</tspan>
  </text>

  <!-- Main Name -->
  <text class="name-text" x="450" y="155">SAKSHAM WADHANKAR</text>

  <!-- Blinking cursor after name -->
  <rect class="cursor-blink" x="705" y="137" width="14" height="24" fill="#00FF41" opacity="0.8"/>

  <!-- Separator line -->
  <line x1="280" y1="180" x2="620" y2="180" stroke="#00FF41" stroke-width="0.5" opacity="0.4"/>

  <!-- Role -->
  <text class="role-text" x="450" y="215">CYBER SECURITY  ◆  AI DEVELOPER</text>

  <!-- Sub info -->
  <text x="450" y="255" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#E6EDF3" opacity="0.5" letter-spacing="3px">SYMBIOSIS INSTITUTE OF TECHNOLOGY</text>

  <!-- Bottom decorative elements -->
  <text x="450" y="280" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#00E5FF" opacity="0.3" letter-spacing="2px">
    ═══════════════════════════════════════════════════
  </text>
</svg>
